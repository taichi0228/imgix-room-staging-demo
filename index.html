<meta name="robots" content="noindex,nofollow,noarchive">

<style>
/* Layout: one centred column of large before/after sliders, captions underneath */
:root{--bg:#f3f4f2;--fg:#1d2420;--muted:#6a736d;--line:#d6dad6;--accent:#2f7a5b;--chip:rgba(20,26,22,.72);
--sans:"IBM Plex Sans JP","Hiragino Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151917;--fg:#e8ece9;--muted:#98a29c;--line:#2c332f;--accent:#6cc39c;--chip:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151917;--fg:#e8ece9;--muted:#98a29c;--line:#2c332f;--accent:#6cc39c;--chip:rgba(0,0,0,.6);color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
main{max-width:880px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px}
header{display:grid;gap:6px}
h1{margin:0;font-size:1.5rem;font-weight:600;text-wrap:balance}
code{font-family:var(--mono);font-size:.9rem;color:var(--accent)}
.note{margin:0;font-size:.78rem;color:var(--muted)}
.ba{margin:0;display:grid;gap:10px}
.stage{position:relative;max-width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:6px;background:var(--line);user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.before{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.handle{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tag{position:absolute;top:10px;padding:3px 8px;border-radius:3px;background:var(--chip);color:#fff;font:600 .72rem/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.tag.l{left:10px} .tag.r{right:10px}
.stage input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.stage:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:3px}
figcaption{font-size:.85rem;color:var(--muted)}
</style>
